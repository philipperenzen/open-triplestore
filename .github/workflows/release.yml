# Release automation for one annotated `vX.Y.Z` tag. It runs when:
#   - auto-tag.yml calls it after tagging a merged release PR (the usual path),
#   - a maintainer pushes a `v*` tag by hand, or
#   - a maintainer runs it from the Actions tab for an existing tag, to publish
#     again after a failure.
#
# 1. release-notes — extracts the matching `## [X.Y.Z]` section from CHANGELOG.md
#    and publishes a GitHub Release with those notes.
# 2. publish-image — builds the 3-stage Dockerfile (its default CARGO_FEATURES:
#    `full` plus the SQL connectors) and pushes it to GHCR (ghcr.io/philipperenzen/open-triplestore).
# 3. publish-reasoner-image — builds the OWL 2 DL reasoner sidecar
#    (sidecars/reasoner/Dockerfile: OWL API + HermiT) and pushes it to GHCR
#    (ghcr.io/philipperenzen/open-triplestore-reasoner), same tags.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: The release tag, for example v0.8.0
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release tag to publish, for example v0.8.0
        type: string
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  # The tag being released: the input when called or dispatched, else the
  # pushed tag.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release-notes:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          # Every tag, to tell whether this one is the newest release.
          fetch-depth: 0

      # A patch on an older line (v0.6.1 after v0.7.0) must not become the
      # latest GitHub Release or move the image's `latest` tag.
      - name: Is this the newest release?
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          newest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
                    | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ "$TAG" = "$newest" ]; then latest=true; else latest=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "$TAG is the newest release: $latest (newest tag: ${newest:-none})"

      # Extract the CHANGELOG section for this tag. TAG is e.g.
      # "v0.2.1"; strip the leading "v" to get the bare version used in the
      # "## [X.Y.Z]" headers, then awk out everything up to the next "## [".
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          echo "Extracting notes for version: $ver"
          hdr="## [$ver]"
          # Fixed-string match (index, not regex): a dynamic-regex "\\[" is dropped
          # to a bare "[" (char class) by some awk builds and silently matches nothing.
          awk -v hdr="$hdr" '
            index($0, hdr) == 1               { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture                           { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No CHANGELOG.md section found for [$ver]. Add a '## [$ver]' entry before tagging."
            exit 1
          fi
          # A GitHub Release body holds at most 125,000 characters, and this
          # job must not fail on it: the image job below needs it. A longer
          # section becomes a digest — the intro, each entry's bold title under
          # its group, and a link to the full section in CHANGELOG.md at this
          # tag. The annotated tag message keeps the section whole.
          if [ "$(wc -m < release_notes.md)" -gt 120000 ]; then
            python3 .github/scripts/release_notes_digest.py \
              "$TAG" "$GITHUB_REPOSITORY" release_notes.md
          fi
          echo "----- release_notes.md ($(wc -m < release_notes.md) characters) -----"
          cat release_notes.md

      # Non-fatal nudge: a release ought to call out security-relevant and
      # deprecation changes. Warn (don't fail) if those subsections are missing.
      - name: Check for Security/Deprecated sections
        shell: bash
        run: |
          if ! grep -q '^### Security' release_notes.md; then
            echo "::warning::Release notes have no '### Security' section — confirm there were no security-relevant changes."
          fi
          if ! grep -q '^### Deprecated' release_notes.md; then
            echo "::warning::Release notes have no '### Deprecated' section — confirm nothing was deprecated this release."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          body_path: release_notes.md
          name: "Open Triplestore ${{ env.TAG }}"
          # A tag like v0.2.1-rc.1 contains a hyphen → mark it a pre-release.
          prerelease: ${{ contains(env.TAG, '-') }}
          # The newest version is the repository's latest release; a patch on
          # an older line is not.
          make_latest: ${{ steps.latest.outputs.latest }}

  publish-image:
    name: Build & push container image
    runs-on: ubuntu-latest
    needs: release-notes
    # Skip on forks: they lack the GHCR package and would fail the push.
    if: github.repository == 'philipperenzen/open-triplestore'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      # NOTE: the very first push creates the GHCR package as *private*. A
      # maintainer must set its visibility to public once (Packages → settings)
      # for anonymous `docker pull` to work.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/philipperenzen/open-triplestore
          # The version comes from TAG, not the triggering ref, which is the
          # merged PR's branch when auto-tag.yml calls this workflow.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ needs.release-notes.outputs.latest == 'true' }}

      # The 3-stage Dockerfile's default CARGO_FEATURES (`full` plus the SQL
      # connectors) is the release feature set, so no build-args are needed here.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-reasoner-image:
    name: Build & push reasoner sidecar image
    runs-on: ubuntu-latest
    needs: release-notes
    if: github.repository == 'philipperenzen/open-triplestore'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      # As for the main image, the first push creates the package as *private*.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/philipperenzen/open-triplestore-reasoner
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ needs.release-notes.outputs.latest == 'true' }}

      # The build context is the repository root (the image ships LICENSES/ and
      # NOTICE); sidecars/reasoner/Dockerfile.dockerignore narrows it.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sidecars/reasoner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
