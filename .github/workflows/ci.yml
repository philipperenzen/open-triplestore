name: CI

on:
  # `develop` is intentionally NOT in this push list: every change reaches it via a
  # PR that already runs CI, and the develop→main release PR runs it again — keeping
  # `develop` here would fire a second, identical run on every push while that PR is
  # open. PRs (below) cover all branches.
  push:
    branches: [main, master, 'release/**']
  pull_request:
  # release-prepare.yml opens its PRs with GITHUB_TOKEN, which starts no
  # pull_request runs, so it dispatches this workflow on the PR's head instead.
  workflow_dispatch:

# Collapse superseded runs: a new push/PR-update on the same ref cancels the
# in-flight one. push (refs/heads/*) and PR (refs/pull/*/merge) have distinct refs,
# so a push never cancels a PR's required check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The `--features full,saml,test-utils,backup-encrypt,alerting` debug build of every test binary fills the runner's small
  # disk ("No space left on device"; the "ld terminated with signal 7 [Bus error]"
  # crash is the same thing — a bus error from mmap on a full disk). Shrink target/:
  # line-tables-only debuginfo (keeps file:line in backtraces) and no incremental
  # artifacts. The heavy jobs additionally reclaim ~25 GB of preinstalled runner
  # tooling in a "Free up disk space" step.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"

jobs:
  backend:
    name: Rust (build, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reclaim ~25 GB of preinstalled tooling the Rust build doesn't need, so the
      # `--features full,saml,test-utils,backup-encrypt,alerting` build of all test binaries doesn't run the disk out.
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      # An S3-compatible server for tests/storage_s3_live.rs (the step after
      # the security tests). Started here, before the build, so it is up long
      # before the tests run. A plain `docker run` rather than a service
      # container: GitHub cannot pass MinIO the `server /data` arguments it
      # needs. The credentials are throwaway values for this container. MinIO
      # publishes no new community images; this tag is the last one.
      - name: Start MinIO
        run: >-
          docker run -d --name minio -p 127.0.0.1:9000:9000
          -e MINIO_ROOT_USER=ots-ci-minio -e MINIO_ROOT_PASSWORD=ots-ci-minio-secret
          quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

      - name: Install system dependencies (GEOS for GeoSPARQL, xmlsec1 for SAML)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libsfcgal-dev cmake pkg-config libclang-dev libssl-dev libxmlsec1-dev lld

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # Hard gate: the tree is fully rustfmt-clean. Run `cargo fmt --all`
      # before pushing if this fails.
      - name: Format check
        run: cargo fmt --all --check

      # `plugin-hello` rides along with the main feature set (not a separate job) so
      # the compile-time plugin architecture — and its cycle-free crate wiring
      # (plugins/api / plugins/hello, src/plugins.rs) — is exercised on every CI run,
      # same as any other optional capability. The plugin crates ALSO build/test
      # standalone at their own default features in the "Plugin crates" job below.
      # The three SQL connector plugins ride along too: their registration in
      # src/plugins.rs compiles only when the main crate is built with them, and
      # the live-sources job builds just `plugin-postgres`.
      # `--workspace` is load-bearing: without it cargo selects only the root
      # package, so the `opengraph` member was never linted or test-compiled. Its
      # test module had been broken (a stale oxigraph `on_store` signature) for
      # long enough that all 59 of its tests silently never ran.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features full,saml,test-utils,backup-encrypt,alerting,plugin-hello,plugin-accounts-dashboard,plugin-postgres,plugin-mysql,plugin-mssql -- -D warnings

      - name: Build
        run: cargo build --features full,saml,test-utils,backup-encrypt,alerting,plugin-hello,plugin-accounts-dashboard,plugin-postgres,plugin-mysql,plugin-mssql --locked

      # The Docker builder stage writes the crates' licence notices with this
      # generator; run it here too, with the image's default CARGO_FEATURES, so
      # a change that breaks it fails a PR, not the next image release.
      - name: Third-party licence notices (server)
        run: python3 scripts/gen_rust_third_party_licenses.py --features full,plugin-postgres,plugin-mysql,plugin-mssql --output "$RUNNER_TEMP/THIRD-PARTY-LICENSES-server.txt"

      # No test is ignored (scripts/no-ignored-tests.sh says why): the source
      # scan catches an `#[ignore]` behind a cfg_attr for another platform,
      # the summary check catches everything this run skipped, doctests too.
      - name: No ignored tests
        run: scripts/no-ignored-tests.sh

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --features full,saml,test-utils,backup-encrypt,alerting,plugin-hello,plugin-accounts-dashboard,plugin-postgres,plugin-mysql,plugin-mssql --locked 2>&1 | tee test.log
          if grep -E 'test result: .* [1-9][0-9]* ignored' test.log; then
            echo "::error::Some tests were ignored — fix or delete them (scripts/no-ignored-tests.sh)."
            exit 1
          fi

      # Explicit, named gate for the security regression suite. These also run in
      # the step above; surfacing them separately makes a security regression
      # obvious in the CI summary. What is NOT acceptable is the filter matching
      # *nothing at all* (e.g. after a rename), which `cargo test` would still
      # exit 0 on — hence the floors below.
      #
      # TWO selections, because either alone has a blind spot:
      #   * `--test 'security_*'` runs the dedicated tests/security_*.rs files.
      #     The name filter misses most of them: libtest matches on the test's
      #     own path, not the binary's name, and a test called
      #     `viewer_cannot_read_private_snapshot_...` contains no "security".
      #   * the `security` name filter catches the `mod security` blocks that
      #     live inside other binaries, which `--test 'security_*'` never selects.
      # Each gets its own floor, so a regression in one cannot be masked by the
      # other being comfortably over its own bar.
      - name: Security regression tests
        shell: bash
        run: |
          set -o pipefail
          count_passed() { printf '%s\n' "$1" | grep -oE '[0-9]+ passed' | awk '{s+=$1} END{print s+0}'; }

          files_out=$(cargo test --features full,saml,test-utils,backup-encrypt,alerting,plugin-hello,plugin-accounts-dashboard,plugin-postgres,plugin-mysql,plugin-mssql --locked --test 'security_*' 2>&1)
          echo "$files_out"
          files_passed=$(count_passed "$files_out")
          echo "==> tests/security_*.rs passed: $files_passed"
          if [ "$files_passed" -lt 30 ]; then
            echo "::error::Expected at least 30 tests from tests/security_*.rs, got $files_passed — a security suite may have been removed or renamed."
            exit 1
          fi

          named_out=$(cargo test --features full,saml,test-utils,backup-encrypt,alerting,plugin-hello,plugin-accounts-dashboard,plugin-postgres,plugin-mysql,plugin-mssql --locked security 2>&1)
          echo "$named_out"
          named_passed=$(count_passed "$named_out")
          echo "==> security-named tests passed across all binaries: $named_passed"
          if [ "$named_passed" -lt 40 ]; then
            echo "::error::Expected at least 40 security-named tests to run, but only $named_passed did — the 'security' filter may be broken (tests renamed/moved). Failing to avoid a silent skip."
            exit 1
          fi

      # The S3 asset store against the MinIO started above: object and HTTP
      # round trips, absent keys, wrong credentials. The Test step ran these
      # without OTS_TEST_S3_ENDPOINT, so they skipped there; this re-run uses
      # the binary it built. OTS_TEST_LIVE_REQUIRED turns a missing or renamed
      # variable into a failure instead of a skip.
      - name: S3 storage against MinIO
        env:
          OTS_TEST_LIVE_REQUIRED: '1'
          OTS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          OTS_TEST_S3_ACCESS_KEY: ots-ci-minio
          OTS_TEST_S3_SECRET_KEY: ots-ci-minio-secret
        run: cargo test --features full,saml,test-utils,backup-encrypt,alerting,plugin-hello,plugin-accounts-dashboard,plugin-postgres,plugin-mysql,plugin-mssql --locked --test storage_s3_live

      - name: MinIO log
        if: always()
        run: docker logs minio || true

  # `sfcgal3d` (certified CSG and volumeExact through native SFCGAL) is in no
  # other job's feature list: the sfcgal 0.8 / sfcgal-sys 0.9 crates need
  # SFCGAL >= 2.0, and Ubuntu 24.04's libsfcgal-dev is 1.5. So this job runs in
  # the Debian trixie Rust image the GitLab jobs use (SFCGAL 2.0, and Rust 1.94
  # like the Dockerfile) and builds the library's unit tests with the feature
  # on, warnings denied, then runs the 3D function tests. The runner's
  # preinstalled tooling is mounted in so the "Free up disk space" step can
  # delete it from inside the container.
  sfcgal3d:
    name: sfcgal3d (native SFCGAL 2.x)
    runs-on: ubuntu-latest
    container:
      image: rust:1.94-trixie
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
        - /opt/hostedtoolcache:/host/toolcache
    env:
      # RUSTFLAGS replaces the linker flag in .cargo/config.toml, so it is
      # repeated here. Dependencies keep their capped lints.
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=lld
    steps:
      - name: Free up disk space
        run: |
          df -h /
          rm -rf /host/dotnet/* /host/android/* /host/ghc/* /host/toolcache/*
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (GEOS, SFCGAL 2.x)
        run: |
          apt-get update -qq
          apt-get install -y -qq libgeos-dev libsfcgal-dev cmake pkg-config libclang-dev libssl-dev lld
          dpkg -s libsfcgal-dev | grep '^Version'

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Build and test the 3D functions with sfcgal3d
        run: cargo test --lib --features full,test-utils,sfcgal3d --locked -- geo::functions3d

  # `default = ["full"]` makes the README's plain `cargo build` produce the
  # binary its Highlights table describes. The minimal configuration then has no
  # job of its own, so every `#[cfg(not(feature = ...))]` fallback would rot
  # unbuilt — this compiles it. Test-only, no clippy gate: the minimal build
  # legitimately has unused-code warnings for the paths its features would use.
  minimal-build:
    name: Minimal build (--no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (GEOS for GeoSPARQL)
        run: sudo apt-get update && sudo apt-get install -y libgeos-dev lld

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Build (no default features)
        run: cargo build --no-default-features --locked

  plugins:
    name: Plugin crates (standalone, default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # Plugin crates (plugins/api, plugins/hello, plugins/accounts-dashboard —
      # see docs/plugins.md) are
      # deliberately independent of the main crate (no dependency on it — see
      # ots-plugin-api's crate docs for why), so they get their own lightweight
      # job: no GEOS/SFCGAL/libxmlsec system deps, no giant feature matrix. This
      # is the "each plugin crate builds/tests on its own, at its own default
      # features" guarantee — the "backend" job separately exercises plugin-hello
      # wired INTO the main crate via the `plugin-hello` feature.
      - name: Clippy (plugin crates)
        run: cargo clippy -p ots-plugin-api -p ots-plugin-hello -p ots-plugin-accounts-dashboard -p ots-plugin-postgres -p ots-plugin-mysql -p ots-plugin-mssql --all-targets -- -D warnings

      - name: Build & test (plugin crates)
        run: cargo test -p ots-plugin-api -p ots-plugin-hello -p ots-plugin-accounts-dashboard -p ots-plugin-postgres -p ots-plugin-mysql -p ots-plugin-mssql --locked

  # The database connectors against real servers. Each driver crate carries a
  # live test that skips when its OTS_TEST_<DIALECT>_HOST is unset — which is
  # every other job — so this one starts the servers as service containers and
  # sets OTS_TEST_LIVE_REQUIRED: a missing or renamed variable fails here
  # instead of skipping. The MySQL plugin serves MariaDB too, so its test runs
  # against both. The passwords are throwaway values for these containers.
  # Every server also gets a certificate from a throwaway CA, so each driver
  # runs once more with tls: true against that CA (OTS_TEST_<DIALECT>_TLS_CA
  # names where it lies on the server; the test reads it back).
  live-sources:
    name: Database connectors against live servers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ots-live-pw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ots-live-pw
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pots-live-pw --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ots-live-pw
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: OtsLive-Passw0rd
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P OtsLive-Passw0rd -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 10s --health-retries 30
    env:
      OTS_TEST_LIVE_REQUIRED: '1'
      OTS_TEST_POSTGRES_HOST: 127.0.0.1
      OTS_TEST_POSTGRES_PASSWORD: ots-live-pw
      OTS_TEST_MYSQL_HOST: 127.0.0.1
      OTS_TEST_MYSQL_PASSWORD: ots-live-pw
      OTS_TEST_MSSQL_HOST: 127.0.0.1
      OTS_TEST_MSSQL_PASSWORD: OtsLive-Passw0rd
      OTS_TEST_MSSQL_READER_PASSWORD: OtsLive-R3ader
      OTS_TEST_POSTGRES_TLS_CA: /var/lib/postgresql/ots-tls/ca.pem
      OTS_TEST_MYSQL_TLS_CA: /var/lib/mysql-files/ots-tls/ca.pem
      OTS_TEST_MSSQL_TLS_CA: /var/opt/mssql/ots-tls/ca.pem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First, so the MariaDB and SQL Server restarts it needs overlap with
      # the build; the tests wait for a server that is still coming back.
      - name: Turn on TLS in the servers
        run: >-
          scripts/live-sources-tls.sh
          ${{ job.services.postgres.id }} ${{ job.services.mysql.id }}
          ${{ job.services.mariadb.id }} ${{ job.services.mssql.id }}

      # The HTTP pipeline test builds the main crate (see the backend job).
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libsfcgal-dev cmake pkg-config libclang-dev libssl-dev libxmlsec1-dev lld

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: PostgreSQL 16
        run: cargo test -p ots-plugin-postgres --test live --locked

      - name: MySQL 8.4
        run: cargo test -p ots-plugin-mysql --test live --locked

      - name: MariaDB 11.4
        env:
          OTS_TEST_MYSQL_PORT: '3307'
        run: cargo test -p ots-plugin-mysql --test live --locked

      - name: SQL Server 2022
        run: cargo test -p ots-plugin-mssql --test live --locked

      # Register, introspect, profile, map, dry-run, run and read the graph
      # back — over HTTP, through the PostgreSQL plugin wired into the store.
      - name: The whole pipeline over HTTP (PostgreSQL)
        run: cargo test --features test-utils,plugin-postgres --test sources_postgres_http --locked

  conformance:
    name: Conformance suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reclaim ~25 GB of preinstalled tooling so the `--features full,saml,test-utils,backup-encrypt,alerting`
      # test binaries below don't run the disk out (see the backend job).
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libsfcgal-dev cmake pkg-config libclang-dev libssl-dev libxmlsec1-dev lld

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # The W3C / GeoSPARQL / OWL 2 / LDP conformance binaries are not run
      # here: the backend job's `cargo test --workspace` runs every one of them
      # with a superset of these features, and running them again here doubled
      # their CI time for nothing. This job keeps what the backend job cannot
      # do: the live reasoner sidecar and the seed bundles on fetched data.

      # OWL 2 DL against the reasoner sidecar the project ships
      # (sidecars/reasoner: OWL API + HermiT). Its live tests and the W3C OWL 2
      # DL runner skip everywhere else; here the sidecar is built (with its own
      # unit tests) and started, and OTS_TEST_LIVE_REQUIRED turns a missing
      # variable into a failure. The test-name filter leaves out the Konclude
      # live tests, which need a Konclude binary this job does not install.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: sidecars/reasoner/pom.xml

      - name: Build and start the reasoner sidecar
        working-directory: sidecars/reasoner
        env:
          OTS_REASONER_TOKEN: ots-ci-reasoner-token
        run: |
          ./mvnw -B -q package
          nohup java -jar target/ots-reasoner.jar > "$RUNNER_TEMP/reasoner.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8090/version && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/reasoner.log"
          exit 1

      - name: OWL 2 DL against the reasoner sidecar (W3C OWL 2 DL test cases + live tests)
        env:
          OTS_TEST_LIVE_REQUIRED: '1'
          OTS_TEST_REASONER_URL: http://127.0.0.1:8090
          OTS_TEST_REASONER_TOKEN: ots-ci-reasoner-token
        run: cargo test --features full,saml,test-utils,backup-encrypt,alerting --locked --test owl2_dl_conformance --test w3c_owl2_dl_manifests -- sidecar_live w3c_owl2_dl

      - name: Reasoner sidecar log
        if: always()
        run: cat "$RUNNER_TEMP/reasoner.log" || true

      # The seed bundles built on national-standard data (NEN 2660-2, IMBOR,
      # GWSW) are not vendored — NEN 2660-2 carries no licence that allows
      # redistributing it, GWSW's ontology states none — so their tests skip
      # everywhere else. Here each bundle's fetch.sh downloads the payloads
      # from the publisher and OTS_TEST_SEED_PAYLOADS_REQUIRED turns a missing
      # payload into a failure instead of a skip.
      - name: Fetch the seed-bundle payloads
        run: |
          examples/seed-bundles/nen2660-imbor/fetch.sh
          examples/seed-bundles/nen2660-relations/fetch.sh
          examples/seed-bundles/gwsw/fetch.sh

      - name: Seed bundles on real data
        env:
          OTS_TEST_SEED_PAYLOADS_REQUIRED: '1'
        run: cargo test --features full,saml,test-utils,backup-encrypt,alerting --locked --test nen2660_imbor_bundle --test nen2660_relations_bundle --test gwsw_bundle

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc --noEmit` over src/. Until this step existed no compiler ever ran:
      # eslint's `no-undef` is disabled for .ts on the grounds that "TypeScript
      # already checks", so a typo'd identifier reached production as a runtime
      # `undefined`. The backlog was cleared when the gate was added.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docs-parity:
    name: Conformance table is generated, not hand-maintained
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The README / docs/standards.md table is written by this script from the
      # test suites; a stale table (counts that no longer match the code) fails.
      - name: Check the conformance table
        run: python3 scripts/conformance_table.py --check
      # The variables .env.example and docs/administration.md document against
      # what docker-compose.yml hands the triplestore service: a forwarded
      # variable neither documents, or an .env.example entry compose never
      # passes on, fails; documented settings compose does not forward are
      # listed as a warning.
      - name: Check the env docs against docker-compose.yml
        run: python3 scripts/check_env_drift.py

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Rust advisories, license, and ban checks (config in deny.toml).
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans sources licenses

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: npm audit (production deps, high severity)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

  # Blocking secret scan: a `.env`, an `ots_` API token, a JWT secret, or any high-entropy
  # credential that slips past .gitignore must fail CI.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: gitleaks
        run: |
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact --verbose --exit-code 1
