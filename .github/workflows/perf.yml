# Performance-regression GATE (authoritative).
#
# Runs a fast subset of the Criterion benchmark suite on every PR (and on pushes
# to main/release/**) for BOTH the change and its merge base, back-to-back on the
# same runner, and compares the two via scripts/perf_regression.py. The script
# exits 0 (within tolerance), 1 (regression — fails the job), or 2 (usage error).
#
# It compares against the merge base rather than the committed baseline because
# the baseline is measured on a different runner instance, so the runner's own
# speed lands in the ratio — see the long note on the bench steps below for the
# numbers. benches/perf_baseline.json still supplies the tolerances, and
# perf-baseline.yml still refreshes its absolute numbers for tracking; they are
# just no longer what a PR is graded against.
#
# Path filters keep docs-only PRs from paying the (slow, native) build+bench cost.
# Caveat: if this job is later promoted to a *required* status check, GitHub
# treats a path-skipped run as "not satisfied" rather than "passed", so a
# docs-only PR would be blocked. That is a branch-protection / repo-settings
# decision — if you make it required, pair it with a path-aware allowance.
#
# Note: Criterion sample sizes are hard-coded in benches/performance.rs, so the
# run time is controlled by the benchmark *name filter* below (query/path/
# geosparql), NOT by a --sample-size flag.
name: Performance

on:
  pull_request:
    paths:
      - 'src/**'
      - 'opengraph/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/perf_regression.py'
      - '.github/workflows/perf.yml'
  # `develop` is intentionally NOT here: every change reaches it through a PR that
  # already runs this gate, and the develop→main release PR runs it again — listing
  # `develop` would fire a second, identical run on every push while that PR is open.
  push:
    branches: [main, 'release/**']
    paths:
      - 'src/**'
      - 'opengraph/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/perf_regression.py'
      - '.github/workflows/perf.yml'

# Collapse superseded runs: a new push/PR-update on the same ref cancels the
# in-flight one. push (refs/heads/*) and PR (refs/pull/*/merge) have distinct refs,
# so a push never cancels a PR's required check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  perf:
    name: Performance regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both revisions are benched in this job, so the base commit has to be in
          # the clone.
          fetch-depth: 0

      - name: Install system dependencies (GEOS for GeoSPARQL, xmlsec1 for SAML)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev cmake pkg-config libclang-dev libssl-dev libxmlsec1-dev lld

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # What this change is measured against: the PR's base commit, or the commit a
      # push moved off. `github.event.before` is all-zeros for a newly created
      # branch, and a force-push can leave a sha that is no longer fetchable — both
      # are reported as "no base" and skip the comparison rather than fail it.
      - name: Resolve the merge base
        id: base
        run: |
          sha='${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}'
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -z "$sha" ] || [ "$sha" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            echo "::notice::No usable base commit ('$sha') — nothing to compare against, skipping."
            echo "sha=" >> "$GITHUB_OUTPUT"
          else
            echo "Comparing against $sha"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi

      # Bench the BASE, then this change, back-to-back on this one machine.
      #
      # This gate used to compare against benches/perf_baseline.json — numbers taken
      # on a different runner instance, days or weeks earlier — so the runner's own
      # speed landed straight in the ratio. Measured on this repo, five gate runs of
      # unchanged code spread by a median of 1.133 and a max of 1.441, and 50 of 68
      # benchmarks could exceed a +10% bar on noise alone. No tolerance table fixes
      # that. Benching both sides here cancels it: a slow VM makes both sides slow,
      # and the ratio holds.
      #
      # Two passes each, fastest median per benchmark (see `collect_medians`), to
      # absorb the drift between the two halves of the job. Criterion overwrites
      # new/estimates.json on the next run, so each pass is moved aside.
      - name: Check out the merge base
        if: steps.base.outputs.sha != ''
        run: git checkout --detach ${{ steps.base.outputs.sha }}
      - name: Bench the merge base (pass 1)
        if: steps.base.outputs.sha != ''
        run: cargo bench --bench performance --features full -- 'query|path|geosparql'
      - name: Set base pass 1 aside
        if: steps.base.outputs.sha != ''
        run: mv target/criterion target/criterion-base-1
      - name: Bench the merge base (pass 2)
        if: steps.base.outputs.sha != ''
        run: cargo bench --bench performance --features full -- 'query|path|geosparql'
      - name: Set base pass 2 aside
        if: steps.base.outputs.sha != ''
        run: mv target/criterion target/criterion-base-2

      # Back to the change — so the comparison, the tolerances and the script are
      # this revision's. That is what lets a PR adjust its own tolerances in the
      # same commit that needs them.
      - name: Check out this change
        if: steps.base.outputs.sha != ''
        run: git checkout --detach ${{ steps.base.outputs.head }}
      - name: Bench this change (pass 1)
        if: steps.base.outputs.sha != ''
        run: cargo bench --bench performance --features full -- 'query|path|geosparql'
      - name: Set change pass 1 aside
        if: steps.base.outputs.sha != ''
        run: mv target/criterion target/criterion-head-1
      - name: Bench this change (pass 2)
        if: steps.base.outputs.sha != ''
        run: cargo bench --bench performance --features full -- 'query|path|geosparql'
      - name: Set change pass 2 aside
        if: steps.base.outputs.sha != ''
        run: mv target/criterion target/criterion-head-2

      # ubuntu-latest ships python3. Tolerances still come from the committed
      # baseline; only its measured numbers go unused here. Non-zero exit fails.
      - name: Check for performance regressions
        if: steps.base.outputs.sha != ''
        run: |
          python3 scripts/perf_regression.py compare \
            --before target/criterion-base-1 --before target/criterion-base-2 \
            --after  target/criterion-head-1 --after  target/criterion-head-2 \
            --baseline benches/perf_baseline.json --github-summary
