# Auto-tag and publish a release when its PR is merged: the last step of
# docs/release-process.md.
#
# Fires when a PR is merged into `main` from `develop`, or into a `release/X.Y`
# maintenance branch. The release version is the `[package] version` in
# Cargo.toml, which the release PR set (release-prepare.yml writes it). If that
# version is already tagged, the merge is not a release and the job does
# nothing. Otherwise it:
#   1. checks the version is the next major, minor or patch after the latest
#      tag (on `release/X.Y`: the next patch after the latest `vX.Y.*` tag),
#   2. creates an annotated `vX.Y.Z` tag on the merge commit whose message is
#      the matching CHANGELOG section, and pushes it,
#   3. runs release.yml for that tag: the GitHub Release and the GHCR image,
#   4. dispatches perf-baseline.yml on the tag to refresh the perf baseline.
#
# Steps 3 and 4 start those workflows themselves because a tag pushed with
# GITHUB_TOKEN starts no workflow runs (GitHub's recursion guard). No personal
# access token is needed. A tag the maintainer pushes by hand still fires release.yml itself.
name: Auto-tag release

on:
  pull_request:
    types: [closed]
    branches: [main, 'release/**']

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag merged release
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.base.ref != 'main' ||
       github.event.pull_request.head.ref == 'develop')
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit, with the full history and every tag.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Validate the version and tag it
        id: tag
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n '/^\[package\]/,/^\[/ s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Cargo.toml version '$version' is not X.Y.Z."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::notice::v$version is already tagged; this merge is not a release."
            exit 0
          fi

          # The latest release tag this one follows: any vX.Y.Z for main, the
          # latest on the line for release/X.Y.
          pattern='v[0-9]*.[0-9]*.[0-9]*'
          if [[ "$BASE" =~ ^release/([0-9]+\.[0-9]+)$ ]]; then
            pattern="v${BASH_REMATCH[1]}.[0-9]*"
          elif [ "$BASE" != main ]; then
            echo "::notice::$BASE is not a release branch; skipping."
            exit 0
          fi
          last="$(git tag -l "$pattern" --sort=-v:refname \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          last="${last:-v0.0.0}"
          IFS=. read -r M m p <<< "${last#v}"
          case "$version" in
            "$((M + 1)).0.0")         bump="major" ;;
            "$M.$((m + 1)).0")        bump="minor" ;;
            "$M.$m.$((p + 1))")       bump="patch" ;;
            *)
              echo "::error::Cargo.toml is $version, which is not the next major, minor or patch after $last."
              exit 1 ;;
          esac
          if [ "$BASE" != main ] && [ "$bump" != patch ]; then
            echo "::error::$BASE takes patch releases only; $version is a $bump release after $last."
            exit 1
          fi

          # Tag message = the CHANGELOG section (the extraction release.yml
          # uses). Fixed-string match, not regex.
          hdr="## [$version]"
          awk -v hdr="$hdr" '
            index($0, hdr) == 1               { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture                           { print }
          ' CHANGELOG.md > tag_message.txt
          if [ ! -s tag_message.txt ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --cleanup=whitespace keeps the section's `### Added` … headers,
          # which the default cleanup strips as comments.
          git tag -a "v$version" --cleanup=whitespace -F tag_message.txt
          git push origin "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "### Tagged \`v$version\` ($bump release after $last)" >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh the perf baseline
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run perf-baseline.yml --ref "$TAG"

  release:
    name: Publish
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
