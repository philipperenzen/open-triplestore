name: Browser E2E (Open Triplestore demo)

# Boots the seeded backend + frontend and drives the public demo through a real
# browser with Playwright.
#
# It gates pull requests. It used to run only on `push` with a path filter that
# excluded `src/server/routes.rs` — the API every page calls — so no PR was ever
# blocked by a browser failure, and a backend change could break the UI without
# any job noticing until someone opened it. The path filter now covers the whole
# backend and build inputs; docs-only changes still skip it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'opengraph/**'
      - 'vendor/**'
      - 'plugins/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main, master, 'release/**']
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'opengraph/**'
      - 'vendor/**'
      - 'plugins/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/e2e.yml'

# Cancel a superseded e2e run when the same ref is pushed again — this 40-min job
# is the most expensive to leave running on a stale commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GeoSPARQL needs GEOS; lld matches .cargo/config.toml.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgeos-dev lld

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Build the demo backend up front so the Playwright webServer start is fast
      # and within its timeout. SAML is intentionally excluded (no xmlsec needed
      # for the UI demo).
      - name: Build backend (demo features)
        run: cargo build --features "rdf-12,owl2-rl,owl2-el,owl2-ql,owl2-dl,text-search,ldp,shex,swrl,asset-archive"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Hermetic (no backend): builds the UI with OTS_BASE_PATH=/ots/, serves it
      # with `vite preview` and loads deep links below the prefix.
      - name: Sub-path deploy smoke test
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run e2e:subpath

      - name: Run e2e
        working-directory: frontend
        env:
          CI: 'true'
          OTS_JWT_SECRET: e2e_jwt_secret_must_be_32_chars_xx
          # Reuse the binary built above instead of `cargo run` (faster startup).
          OTS_BACKEND_CMD: ../target/debug/open-triplestore --bind 127.0.0.1 --port 7878 --data-dir ./e2e-data --log-level warn
          # Keep the boot seed chain short on the 2-core runner: skip the
          # standard-vocabulary registry seed (55+ versions incl. the 66k-triple
          # IMBOR vocabulaire — minutes in a debug build, and its store/SQLite
          # writes contend with the tests' own imports) and, through
          # OTS_OFFLINE, every startup download (the LOV corpus, the demo IFC
          # models). No e2e spec depends on either; the demo datasets and saved
          # queries the specs use are seeded regardless.
          OTS_SEED_STANDARD_VOCABS_ENABLED: 'false'
          OTS_OFFLINE: 'true'
        run: npm run e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/playwright-report-subpath/
          retention-days: 7
