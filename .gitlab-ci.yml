# GitLab CI/CD for Open Triplestore.
#
# Mirrors the GitHub Actions workflows (.github/workflows/ci.yml, perf.yml,
# perf-baseline.yml, release.yml + e2e.yml) so a fork hosted on any GitLab
# instance (gitlab.com or self-managed) gets the same gates: rustfmt + clippy +
# build + test (incl. conformance & security suites), a --no-default-features
# build, the plugin crates on their own, the database connectors
# against live PostgreSQL / MySQL / MariaDB / SQL Server services, the frontend
# lint/test/build, the cargo-deny supply-chain audit (advisories, bans, sources,
# licenses), an npm production-dependency audit, a gitleaks secret scan, the
# performance-regression gate, and a tag-driven release. Commands and versions
# track the GitHub jobs, with two intentional differences: (1) the GitLab perf
# jobs install python3 explicitly, which the GitHub ubuntu-latest runner already
# ships (see the perf job below); and (2) the rust job here keeps
# `--all-features` where ci.yml names its features, so it also compiles
# `sfcgal3d` (hence the extra libsfcgal-dev native dep in before_script), which
# ci.yml builds in a job of its own. That feature is also why every
# rust job runs on a *trixie*-based image: the `sfcgal`/`sfcgal-sys` crates
# (0.8.x/0.9.x) need native SFCGAL >= 2.0 at build time, and Debian bookworm
# only packages libsfcgal 1.4.1 (its headers lack the 2.x API, so the sfcgal
# crate fails with E0432 unresolved imports); trixie ships 2.0.0.
# The rust job also runs the S3 storage tests against a MinIO service (ci.yml's
# backend job starts the same MinIO), and the image-build job mirrors
# .github/workflows/image.yml.

stages:
  - check
  - test
  - perf
  - audit
  - release

variables:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Keep the cargo home inside the project so it can be cached between pipelines.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  GIT_DEPTH: "20"

# ── Rust: format, lint, build, test ───────────────────────────────────────────
# `cargo test --all-features` runs the unit, integration, conformance AND
# security-regression suites (which ci.yml surfaces as separate steps), once.
rust:
  stage: test
  # An S3-compatible server for tests/storage_s3_live.rs; the last script line
  # runs them with OTS_TEST_LIVE_REQUIRED (see ci.yml's "S3 storage against
  # MinIO" step). Throwaway credentials; MinIO publishes no new community
  # images, so this tag is the last one.
  services:
    - name: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
      alias: minio
      command: ["server", "/data"]
  variables:
    MINIO_ROOT_USER: ots-ci-minio
    MINIO_ROOT_PASSWORD: ots-ci-minio-secret
  # trixie, not bookworm: `--all-features` pulls in sfcgal-sys, which needs
  # native SFCGAL >= 2.0 (bookworm's libsfcgal-dev 1.4.1 is too old — see the
  # header note). And 1.94, not 1.91: the AWS SDK stack (aws-credential-types
  # 1.3.0, aws-smithy-runtime 1.12) declares `rust-version = "1.94.1"`, which is
  # the package's `rust-version` too; 1.94 matches the Dockerfile builder stage.
  # The other rust jobs use the same image so the shared cache below never mixes
  # distros, and the "-trixie" in the key retires the bookworm-era caches (their
  # -sys build-script probes point at the old distro's system libs) instead of
  # inheriting them.
  image: rust:1.94-trixie
  cache:
    key: "rust-trixie-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
  before_script:
    # GEOS for GeoSPARQL; SFCGAL for the `sfcgal3d` feature (pulled in by
    # `--all-features` below — sfcgal-sys is a `-sys` crate that needs the native
    # SFCGAL >= 2.0 headers at build time, hence the trixie image); the rest
    # match the GitHub backend job (SAML/xmlsec, TLS). Without libsfcgal-dev the
    # `--all-features` build fails.
    - apt-get update -qq
    - apt-get install -y -qq libgeos-dev libsfcgal-dev cmake pkg-config libclang-dev libssl-dev libxmlsec1-dev lld
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all --check
    # `--workspace`: without it cargo selects only the root package, so the
    # `opengraph` member is neither linted nor test-compiled (see ci.yml).
    # `--all-features` also wires the three SQL connector plugins into the main
    # crate, as ci.yml's backend job does by naming them.
    - cargo clippy --workspace --all-targets --all-features -- -D warnings
    - cargo build --all-features --locked
    # No test is ignored (see scripts/no-ignored-tests.sh and ci.yml).
    - scripts/no-ignored-tests.sh
    # The buildingSMART IDS corpus is fetched by its runner (pinned commit,
    # SHA-256 checked); a failed download fails here instead of skipping.
    - set -o pipefail; OTS_TEST_IDS_CORPUS_REQUIRED=1 cargo test --workspace --all-features --locked 2>&1 | tee test.log
    - if grep -E 'test result:.* [1-9][0-9]* ignored' test.log; then echo "Some tests were ignored"; exit 1; fi
    # The S3 storage tests skipped in the run above (no endpoint set); this
    # re-run reuses its binary.
    - OTS_TEST_LIVE_REQUIRED=1 OTS_TEST_S3_ENDPOINT=http://minio:9000 OTS_TEST_S3_ACCESS_KEY=$MINIO_ROOT_USER OTS_TEST_S3_SECRET_KEY=$MINIO_ROOT_PASSWORD cargo test --all-features --locked --test storage_s3_live

# ── Database connectors against live servers (mirrors ci.yml live-sources) ──
# Each driver crate's live test skips when its OTS_TEST_<DIALECT>_HOST is
# unset; here the servers run as services and OTS_TEST_LIVE_REQUIRED turns a
# missing variable into a failure. GitLab waits only for a service's port, so
# each test retries its administrator connection while the server starts. The
# passwords are throwaway values for these containers.
# Every server also makes itself a certificate from a throwaway CA as it
# starts (OTS_LIVE_TLS_GEN, the GitLab twin of scripts/live-sources-tls.sh:
# services cannot see the repository), so each driver runs once more with
# tls: true against that CA; OTS_TEST_<DIALECT>_TLS_CA names where it lies on
# the server and the test reads it back.
live-sources:
  stage: test
  image: rust:1.94-trixie
  services:
    - name: postgres:16
      alias: postgres
      variables:
        OTS_TLS_DIR: /var/lib/postgresql/ots-tls
        OTS_TLS_OWNER: postgres
      entrypoint:
        - sh
        - -c
        - >-
          eval "$(printenv OTS_LIVE_TLS_GEN)" &&
          exec docker-entrypoint.sh postgres -c ssl=on
          -c ssl_cert_file=/var/lib/postgresql/ots-tls/server.pem
          -c ssl_key_file=/var/lib/postgresql/ots-tls/server.key
    - name: mysql:8.4
      alias: mysql
      variables:
        OTS_TLS_DIR: /var/lib/mysql-files/ots-tls
        OTS_TLS_OWNER: mysql
      entrypoint:
        - sh
        - -c
        - >-
          eval "$(printenv OTS_LIVE_TLS_GEN)" &&
          exec docker-entrypoint.sh mysqld
          --ssl-ca=/var/lib/mysql-files/ots-tls/ca.pem
          --ssl-cert=/var/lib/mysql-files/ots-tls/server.pem
          --ssl-key=/var/lib/mysql-files/ots-tls/server.key
    - name: mariadb:11.4
      alias: mariadb
      variables:
        OTS_TLS_DIR: /var/lib/mysql-files/ots-tls
        OTS_TLS_OWNER: mysql
      entrypoint:
        - sh
        - -c
        - >-
          eval "$(printenv OTS_LIVE_TLS_GEN)" &&
          exec docker-entrypoint.sh mariadbd
          --ssl-ca=/var/lib/mysql-files/ots-tls/ca.pem
          --ssl-cert=/var/lib/mysql-files/ots-tls/server.pem
          --ssl-key=/var/lib/mysql-files/ots-tls/server.key
    - name: mcr.microsoft.com/mssql/server:2022-latest
      alias: mssql
      variables:
        OTS_TLS_DIR: /var/opt/mssql/ots-tls
        OTS_TLS_OWNER: mssql
      entrypoint:
        - sh
        - -c
        - >-
          eval "$(printenv OTS_LIVE_TLS_GEN)" &&
          exec /opt/mssql/bin/launch_sqlservr.sh /opt/mssql/bin/sqlservr
  variables:
    # A CA and a server certificate for every service name, made inside the
    # service before the server starts; SQL Server reads its certificate
    # from mssql.conf. Not expanded, so the services see the script as is.
    OTS_LIVE_TLS_GEN:
      expand: false
      value: |
        set -e
        d=$OTS_TLS_DIR
        mkdir -p "$d"
        openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=ots-live-test-ca -keyout "$d/ca.key" -out "$d/ca.pem" 2>/dev/null
        openssl req -newkey rsa:2048 -nodes -subj /CN=ots-live-test-server -keyout "$d/server.key" -out "$d/server.csr" 2>/dev/null
        printf '%s\n' 'subjectAltName=DNS:localhost,IP:127.0.0.1,DNS:postgres,DNS:mysql,DNS:mariadb,DNS:mssql' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' > "$d/server.ext"
        openssl x509 -req -in "$d/server.csr" -CA "$d/ca.pem" -CAkey "$d/ca.key" -CAcreateserial -days 2 -extfile "$d/server.ext" -out "$d/server.pem" 2>/dev/null
        chmod 600 "$d/server.key"
        if [ "$(id -u)" = 0 ]; then chown -R "$OTS_TLS_OWNER" "$d"; fi
        case $d in /var/opt/mssql/*) printf '%s\n' '[network]' "tlscert = $d/server.pem" "tlskey = $d/server.key" 'forceencryption = 0' > /var/opt/mssql/mssql.conf;; esac
        set +e
    POSTGRES_PASSWORD: ots-live-pw
    MYSQL_ROOT_PASSWORD: ots-live-pw
    MARIADB_ROOT_PASSWORD: ots-live-pw
    ACCEPT_EULA: "Y"
    MSSQL_SA_PASSWORD: OtsLive-Passw0rd
    OTS_TEST_LIVE_REQUIRED: "1"
    OTS_TEST_POSTGRES_HOST: postgres
    OTS_TEST_POSTGRES_PASSWORD: ots-live-pw
    OTS_TEST_MYSQL_HOST: mysql
    OTS_TEST_MYSQL_PASSWORD: ots-live-pw
    OTS_TEST_MSSQL_HOST: mssql
    OTS_TEST_MSSQL_PASSWORD: OtsLive-Passw0rd
    OTS_TEST_MSSQL_READER_PASSWORD: OtsLive-R3ader
    OTS_TEST_POSTGRES_TLS_CA: /var/lib/postgresql/ots-tls/ca.pem
    OTS_TEST_MYSQL_TLS_CA: /var/lib/mysql-files/ots-tls/ca.pem
    OTS_TEST_MSSQL_TLS_CA: /var/opt/mssql/ots-tls/ca.pem
  cache:
    key: "rust-trixie-live-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libgeos-dev libsfcgal-dev cmake pkg-config libclang-dev libssl-dev libxmlsec1-dev lld curl
  script:
    - cargo test -p ots-plugin-postgres --test live --locked
    - cargo test -p ots-plugin-mysql --test live --locked
    - OTS_TEST_MYSQL_HOST=mariadb cargo test -p ots-plugin-mysql --test live --locked
    - cargo test -p ots-plugin-mssql --test live --locked
    - cargo test --features test-utils,plugin-postgres --test sources_postgres_http --locked
    # The W3C R2RML test cases on SQLite, PostgreSQL and MySQL — fetched at a
    # pinned commit, never vendored (see the script).
    - scripts/fetch-w3c-r2rml-tests.sh
    - OTS_TEST_R2RML_REQUIRED=1 cargo test --features test-utils,plugin-postgres,plugin-mysql --test w3c_r2rml_conformance --locked

# ── Minimal build (mirrors ci.yml minimal-build) ──────────────────────────────
# `--no-default-features` must keep compiling: a feature gate that only the full
# build exercises breaks here first.
minimal-build:
  stage: test
  image: rust:1.94-trixie
  cache:
    key: "rust-trixie-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
    policy: pull
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libgeos-dev cmake pkg-config libclang-dev libssl-dev lld
  script:
    - cargo build --no-default-features --locked

# ── Plugin crates on their own (mirrors ci.yml plugins) ───────────────────────
# The plugin crates do not depend on the main crate, so each one must build,
# lint and test at its own default features, without the main crate's system
# libraries; the rust job covers plugin-hello wired INTO the main crate.
plugins:
  stage: test
  image: rust:1.94-trixie
  cache:
    key: "rust-trixie-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
    policy: pull
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq pkg-config libssl-dev
    - rustup component add clippy
  script:
    - cargo clippy -p ots-plugin-api -p ots-plugin-hello -p ots-plugin-accounts-dashboard -p ots-plugin-postgres -p ots-plugin-mysql -p ots-plugin-mssql --all-targets -- -D warnings
    - cargo test -p ots-plugin-api -p ots-plugin-hello -p ots-plugin-accounts-dashboard -p ots-plugin-postgres -p ots-plugin-mysql -p ots-plugin-mssql --locked

# ── Seed bundles on real data (mirrors the last steps of ci.yml conformance) ─
# NEN 2660-2, IMBOR and GWSW are not vendored (NEN 2660-2 carries no licence
# that allows redistributing it), so each bundle's fetch.sh downloads them from
# the publisher and OTS_TEST_SEED_PAYLOADS_REQUIRED fails a missing payload.
# Geonovum's DCAT-AP-NL 3 shapes are fetched the same way (no LICENSE file
# upstream) for the DCAT conformance suite.
seed-bundles:
  stage: test
  image: rust:1.94-trixie
  variables:
    OTS_TEST_SEED_PAYLOADS_REQUIRED: "1"
  cache:
    key: "rust-trixie-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
    policy: pull
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libgeos-dev libsfcgal-dev cmake pkg-config libclang-dev libssl-dev libxmlsec1-dev lld curl unzip
  script:
    - examples/seed-bundles/nen2660-imbor/fetch.sh
    - examples/seed-bundles/nen2660-relations/fetch.sh
    - examples/seed-bundles/gwsw/fetch.sh
    - tests/fixtures/geonovum-dcat-ap-nl-3/fetch.sh
    - cargo test --all-features --locked --test nen2660_imbor_bundle --test nen2660_relations_bundle --test gwsw_bundle
    - OTS_TEST_DCAT_AP_NL_REQUIRED=1 cargo test --all-features --locked --test dcat_conformance

# ── Conformance table parity (mirrors the GitHub docs-parity job) ────────────
# README.md / docs/standards.md carry a table generated from the test suites;
# a stale one fails here.
docs-parity:
  stage: check
  image: python:3-slim
  script:
    - python3 scripts/conformance_table.py --check
    - python3 scripts/check_compose_env.py
    # The env docs (.env.example, docs/administration.md) against what
    # docker-compose.yml forwards to the triplestore service (see ci.yml).
    - python3 scripts/check_env_drift.py

# ── Performance-regression GATE (mirrors .github/workflows/perf.yml) ──────────
# Subset Criterion bench of the merge base and this change on the same runner,
# a soft screening comparison, then a re-bench of only the flagged benchmarks
# before anything fails. Runs on merge requests and on pushes to
# main/develop/release/*. Sample sizes are hard-coded in benches/performance.rs,
# so the name filter (not --sample-size) controls runtime.
perf:
  stage: perf
  # Same trixie image as the rust job (shared cache key — see the note there).
  image: rust:1.94-trixie
  cache:
    key: "rust-trixie-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
  before_script:
    # GEOS + the usual native deps, matching the GitHub backend job, PLUS
    # python3, which the GitHub ubuntu-latest runner already ships. The
    # rust:1.94-trixie image happens to include python3 today, but we install it
    # explicitly rather than depend on the base image's incidental contents.
    # This added `python3` is the one intentional GitHub/GitLab difference (the
    # perf script is invoked the same way on both).
    - apt-get update -qq
    - apt-get install -y -qq libgeos-dev cmake pkg-config libclang-dev libssl-dev libxmlsec1-dev lld python3
  variables:
    # Both revisions get benched, so the base commit has to be in the clone.
    GIT_DEPTH: "0"
  script:
    # The only coverage the gate's own comparison logic has: seconds, and it
    # runs before the hour of benching so a broken gate fails fast.
    - bash scripts/perf_selftest.sh
    # Bench the merge base and this change back-to-back on the same runner, two
    # passes each (fastest median per benchmark wins), then compare the two. The
    # committed baseline is measured on a different runner instance, so comparing
    # against it puts the runner's own speed in the ratio — see the long note on
    # the bench steps in .github/workflows/perf.yml for the measurements.
    - BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}"
    - HEAD="$(git rev-parse HEAD)"
    - |
      if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
        echo "No usable base commit ('$BASE') — nothing to compare against, skipping."; exit 0
      fi
    # base, change, base, change — alternating, not two-and-two: a runner drifts
    # over the hour this takes, so consecutive halves are not comparable. Each
    # pass moves into a directory cleared first: `mv A B` nests A INSIDE B when B
    # exists, and the cached target/ can still hold the last pipeline's passes —
    # nesting prefixes every bench id with "criterion/" and disables every
    # tolerance key in the baseline.
    #
    # The first comparison only SCREENS (`--soft`): applied to every benchmark at
    # once, two samples a side still let some benchmark trip the bar by luck. The
    # flagged ids get a third pass on each side — interference only ever slows a
    # benchmark, so a real regression reproduces and a fluke does not — and the
    # gate then compares all three. Nothing flagged: the screen is the result.
    - |
      bench() {
        git checkout --detach "$1"
        OTS_QUERY_CACHE=off cargo bench --bench performance --features full -- "$3"
        rm -rf "target/criterion-$2"
        mv target/criterion "target/criterion-$2"
      }
      GATED='query|path|geosparql|insert|update|shacl|concurrent'
      bench "$BASE" base-1 "$GATED"
      bench "$HEAD" head-1 "$GATED"
      bench "$BASE" base-2 "$GATED"
      bench "$HEAD" head-2 "$GATED"
      python3 scripts/perf_regression.py compare \
        --before target/criterion-base-1 --before target/criterion-base-2 \
        --after  target/criterion-head-1 --after  target/criterion-head-2 \
        --baseline benches/perf_baseline.json \
        --summary-title 'Performance vs merge base (screening)' \
        --soft --flagged-out target/perf-flagged.txt
      FLAGGED="$(cat target/perf-flagged.txt 2>/dev/null || true)"
      if [ -n "$FLAGGED" ]; then
        echo "Confirming: $FLAGGED"
        bench "$BASE" base-3 "$FLAGGED"
        bench "$HEAD" head-3 "$FLAGGED"
        python3 scripts/perf_regression.py compare \
          --before target/criterion-base-1 --before target/criterion-base-2 --before target/criterion-base-3 \
          --after  target/criterion-head-1 --after  target/criterion-head-2 --after  target/criterion-head-3 \
          --baseline benches/perf_baseline.json \
          --summary-title 'Performance vs merge base (confirmed)'
      fi

# ── Performance baseline refresh (mirrors .github/workflows/perf-baseline.yml) ─
# Full Criterion suite → regenerated baseline as a CI artifact. Runs on `v*`
# tags and on manual/web triggers. Committing the baseline back to the repo
# needs a project access token, so GitLab keeps this artifact-only — GitHub is
# the canonical source that opens the baseline-refresh PR.
perf-baseline:
  stage: perf
  # Same trixie image as the rust job (shared cache key — see the note there).
  image: rust:1.94-trixie
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  cache:
    key: "rust-trixie-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
  before_script:
    # Same native deps as the perf job, plus python3 (see the perf job note).
    - apt-get update -qq
    - apt-get install -y -qq libgeos-dev cmake pkg-config libclang-dev libssl-dev libxmlsec1-dev lld python3
  script:
    # Full suite, then a second pass over exactly the subset the gate runs, so the
    # gated benchmarks are baselined under gate conditions rather than full-suite
    # ones (see the same two steps in .github/workflows/perf-baseline.yml for why).
    - OTS_QUERY_CACHE=off cargo bench --bench performance --features full
    - OTS_QUERY_CACHE=off cargo bench --bench performance --features full -- 'query|path|geosparql|insert|update|shacl|concurrent'
    - cp -r target/criterion target/criterion-pass1
    - OTS_QUERY_CACHE=off cargo bench --bench performance --features full -- 'query|path|geosparql|insert|update|shacl|concurrent'
    - python3 scripts/perf_regression.py update --criterion-dir target/criterion-pass1 --criterion-dir target/criterion --out benches/perf_baseline.json --runner "gitlab-ci/$CI_RUNNER_DESCRIPTION" --keep-tolerances
  artifacts:
    paths:
      - benches/perf_baseline.json
    expire_in: 90 days

# ── Frontend: lint, test, build ───────────────────────────────────────────────
frontend:
  stage: test
  image: node:24-bookworm
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint
    # `tsc --noEmit` (see ci.yml): eslint's no-undef is off for .ts, so without
    # it a typo'd identifier reaches the build as a runtime `undefined`.
    - npm run typecheck
    - npm run test
    - npm run build

# ── Supply-chain audit: cargo-deny (advisories, bans, sources, licenses) ──────
cargo-deny:
  stage: audit
  # Same trixie image as the other rust jobs (one image to pull per runner).
  image: rust:1.94-trixie
  cache:
    key: "deny-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/bin/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq pkg-config libssl-dev
    - cargo install cargo-deny --locked --version ^0.16
  script:
    # Every feature, as cargo-deny-action does on GitHub by default: without
    # it optional dependencies drop out of the graph and their advisories are
    # never seen. cargo-deny compiles nothing, so `sfcgal3d` costs nothing here.
    - cargo deny --all-features check advisories bans sources licenses

# ── npm audit (production dependencies, high severity) ────────────────────────
npm-audit:
  stage: audit
  image: node:24-bookworm
  script:
    - cd frontend
    - npm audit --audit-level=high --omit=dev

# ── Secret scan (gitleaks; same version + flags as the GitHub job) ────────────
secret-scan:
  stage: check
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates tar
  script:
    - VER=8.18.4
    - curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
    - ./gitleaks detect --source . --no-git --redact --verbose --exit-code 1

# ── Container image (mirrors .github/workflows/image.yml) ────────────────────
# Builds the release image with its default CARGO_FEATURES, without pushing,
# and starts it until /livez answers. Merge requests that touch the image's
# build inputs build the fast `release-dev` profile; scheduled pipelines (set
# one up under CI/CD → Schedules for the nightly run) and manual ones build
# `release`. Needs a runner that allows privileged Docker-in-Docker.
image-build:
  stage: test
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    CARGO_PROFILE: release
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Dockerfile
        - .dockerignore
        - Cargo.toml
        - Cargo.lock
        - "**/Cargo.toml"
        - ".cargo/**/*"
        - "vendor/**/*"
      variables:
        CARGO_PROFILE: release-dev
  script:
    - docker build --build-arg CARGO_PROFILE="$CARGO_PROFILE" -t open-triplestore:ci .
    - docker run -d --name ots -e SEED_STANDARDS_DEMO=false -e SEED_IFC_URL= open-triplestore:ci
    # The runtime image ships curl (its HEALTHCHECK uses it); the docker:27
    # image does not, so the probe runs inside the container.
    - |
      for i in $(seq 1 90); do
        if docker exec ots curl -sf http://localhost:7878/livez; then
          echo; echo "The image answers /livez after ${i} s."; exit 0
        fi
        [ "$(docker inspect -f '{{.State.Running}}' ots)" = true ] || { echo "The container exited."; break; }
        sleep 1
      done
      docker logs ots
      exit 1
  after_script:
    - docker logs ots 2>&1 | tail -n 200 || true

# ── Browser e2e (mirrors e2e.yml). Manual/opt-in: browser e2e is environment-
# sensitive on self-managed runners, so it does not gate the pipeline. Trigger it
# from the pipeline view when wanted. ─────────────────────────────────────────
e2e:
  stage: test
  image: rust:1.94-trixie
  when: manual
  allow_failure: true
  variables:
    CI: "true"
    JWT_SECRET: "e2e_jwt_secret_must_be_32_chars_xx"
    RATE_LIMIT_DISABLED: "1"
    OTS_BACKEND_CMD: "../target/debug/open-triplestore --bind 127.0.0.1 --port 7878 --data-dir ./e2e-data --log-level warn"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libgeos-dev cmake pkg-config libclang-dev libssl-dev libxmlsec1-dev lld curl
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
    - apt-get install -y -qq nodejs
  script:
    - cargo build --features "rdf-12,owl2-rl,owl2-el,owl2-ql,owl2-dl,text-search,ldp,shex,swrl"
    - cd frontend
    - npm ci
    - npx playwright install --with-deps chromium
    - npm run e2e

# ── Release (mirrors .github/workflows/release.yml) ───────────────────────────
# On a `v*` tag, extract the matching CHANGELOG section and publish a GitLab
# Release. Container images are published from the GitHub workflow (GHCR); GitLab
# stays release-notes-only here for parity. CI_COMMIT_TAG is e.g. "v0.2.1"; the
# bare version (stripped "v") is what the "## [X.Y.Z]" headers use.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - ver="${CI_COMMIT_TAG#v}"
    - echo "Extracting notes for version $ver"
    - |
      hdr="## [$ver]"
      # Fixed-string match (index, not regex): portable across awk implementations.
      awk -v hdr="$hdr" '
        index($0, hdr) == 1               { capture = 1; next }
        capture && index($0, "## [") == 1 { exit }
        capture                           { print }
      ' CHANGELOG.md > release_notes.md
    - test -s release_notes.md || { echo "No CHANGELOG section for [$ver]"; exit 1; }
    - cat release_notes.md
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Open Triplestore $CI_COMMIT_TAG"
    description: release_notes.md
