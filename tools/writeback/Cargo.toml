[package]
name = "ots-writeback"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "The external writeback worker: follows a store's LDES stream (or reads a fragment file), inverts an RML mapping, and upserts the changed entities into a SQL database — never inside the store."
publish = false

[[bin]]
name = "ots-writeback"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
oxrdf = "0.3"
oxttl = "0.2"
postgres = "0.19"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
