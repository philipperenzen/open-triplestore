[package]
name = "ots-plugin-mssql"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Open Triplestore plugin: the SQL Server datasource connector — read-only account checked, statement-timed, streaming."

[dependencies]
ots-plugin-api = { path = "../api" }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
