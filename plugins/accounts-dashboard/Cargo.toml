[package]
name = "ots-plugin-accounts-dashboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Open Triplestore plugin: deployment-wide accounts overview — users, organisations, per-app entitlements and merged LLM usage (store log + external gateway ledger)."

[dependencies]
ots-plugin-api = { path = "../api" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# `rustls-no-provider` + ring, like the host (see src/http_client.rs there):
# reqwest's `rustls` feature would add aws-lc-rs as a second rustls provider.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
